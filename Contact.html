<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Travel Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Travel Explorer</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="tours.html">Tours</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <div class="container" style="max-width: 600px;">
    <h2 class="section-title">Contact Us</h2>

    <form onsubmit="alert('Thank you! Your message has been sent successfully.'); return false;">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" required placeholder="Enter full name">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" required placeholder="Enter email address">
      </div>

      <div class="form-group">
        <label>Select Tour Interest</label>
        <input type="text" placeholder="e.g., Hunza, Skardu, Lahore">
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea rows="5" required placeholder="Write your message..."></textarea>
      </div>

      <button type="submit" class="btn-details">Send Message</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 Travel Explorer. All rights reserved.</p>
  </footer>

</body>
</html>
